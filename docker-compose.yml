services:
  app:
    build: .
    image: xui-hub:latest
    container_name: xui-hub
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      # 默认直接对公网开 8788:http://<服务器 IP>:8788 就是后台。要只绑本机(前面自己放反代)就在 .env 里设 LISTEN_ADDR=127.0.0.1
      - "${LISTEN_ADDR:-0.0.0.0}:${HOST_PORT:-8788}:8788"
    volumes:
      # 数据库(含面板 token)。宿主机目录需属于 uid 1000:mkdir -p data && chown 1000:1000 data
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
