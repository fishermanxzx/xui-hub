# PR 检查:后端类型检查 + 测试 + 打包,前端类型检查 + 打包,脚本语法。main 的分支保护要求这个检查通过才能合并。
name: ci
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: 后端:依赖、类型检查、测试、打包
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: 前端:依赖、类型检查、打包
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: 脚本语法
        run: bash -n install.sh scripts/xui-hub scripts/build-release.sh scripts/docker-ssl.sh
