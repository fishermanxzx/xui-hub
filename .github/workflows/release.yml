# 打 tag(v*)时构建 amd64 / arm64 两个发布包并创建 GitHub Release,install.sh 从这里下载。
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/build-release.sh ${{ matrix.arch }} ${{ github.ref_name }} dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: xui-hub-linux-${{ matrix.arch }}
          path: dist-release/*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - run: ls -l dist-release
      - run: gh release create "$GITHUB_REF_NAME" dist-release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
