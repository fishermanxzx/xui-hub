services:
  app:
    build: .
    image: xui-hub:latest
    container_name: xui-hub
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # 订阅转换 Clash / sing-box 等格式用的内部 subconverter;它回源到本服务取节点
      SUBCONVERTER_URL: http://subconverter:25500
      APP_INTERNAL_URL: http://app:8788
    depends_on:
      - subconverter
    ports:
      # 只绑宿主机本地:公网访问经下面的 caddy(HTTPS),或用 SSH 隧道
      - "127.0.0.1:8788:8788"
    volumes:
      # 数据库(含面板 token)。宿主机目录需属于 uid 1000:mkdir -p data && sudo chown 1000:1000 data
      - ./data:/data
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # 订阅格式转换引擎(Clash / Surge 格式)。只在 compose 内网可访问,不暴露端口
  subconverter:
    image: asdlokj1qpi23/subconverter:0.9.9
    container_name: xui-hub-subconverter
    restart: unless-stopped
    logging: *logging

  # 公网 HTTPS 入口(可选):.env 里设置 DOMAIN 后用 `docker compose --profile https up -d` 启动
  caddy:
    image: caddy:2.10
    container_name: xui-hub-caddy
    profiles: [https]
    restart: unless-stopped
    # 不占 80:面板机上 acme.sh 续 IP 证书要用 80(standalone);Caddy 用 443 上的 TLS-ALPN 签证书
    ports:
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      # 按目录挂载:单文件挂载时,同步工具替换文件后容器里仍是旧文件
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    logging: *logging

  # Cloudflare Tunnel:订阅域名经隧道回源到本服务(服务器 IP 被墙时订阅仍可更新)。
  # .env 里设置 CF_TUNNEL_TOKEN,COMPOSE_PROFILES 加上 tunnel;隧道的公共主机名服务填 HTTP app:8788
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    container_name: xui-hub-cloudflared
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      - app
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
